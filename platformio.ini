[platformio]
default_envs = c3_transponder

[env]
monitor_speed = 19200
lib_ldf_mode = deep+

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<*>
build_flags =
    -std=gnu++17

[env:c3_transponder]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DIDLAP_PROFIL_TRANSPONDER=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIDLAP_AKTIF_W5500=0
    -DIDLAP_AKTIF_OLED=0
    -DIDLAP_AKTIF_LED=1
    -DIDLAP_AKTIF_BUZZER=0

[decoder_common]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -Iinclude
    -DIDLAP_PROFIL_DECODER=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIDLAP_AKTIF_LED=1
    -DIDLAP_AKTIF_BUZZER=1

[decoder_network]
build_flags =
    ${decoder_common.build_flags}
    -DWEBSOCKETS_NETWORK_TYPE=2
    -DWEBSOCKETS_SERVER_CLIENT_MAX=2
    -DWEBSOCKETS_TCP_TIMEOUT=50
    -DNODEBUG_WEBSOCKETS
    -include include/WebSocketsNetworkClient.h
lib_deps =
    arduino-libraries/Ethernet@2.0.2
    links2004/WebSockets@2.6.1

[env:c3_decoder_minimal]
platform = ${decoder_common.platform}
board = ${decoder_common.board}
framework = ${decoder_common.framework}
build_flags =
    ${decoder_common.build_flags}
    -DIDLAP_AKTIF_W5500=0
    -DIDLAP_AKTIF_OLED=0

[env:c3_decoder_w5500]
platform = ${decoder_common.platform}
board = ${decoder_common.board}
framework = ${decoder_common.framework}
build_flags =
    ${decoder_network.build_flags}
    -DIDLAP_AKTIF_W5500=1
    -DIDLAP_AKTIF_OLED=0
lib_deps = ${decoder_network.lib_deps}

[env:c3_decoder_lengkap]
platform = ${decoder_common.platform}
board = ${decoder_common.board}
framework = ${decoder_common.framework}
build_flags =
    ${decoder_network.build_flags}
    -DIDLAP_AKTIF_W5500=1
    -DIDLAP_AKTIF_OLED=1
lib_deps =
    ${decoder_network.lib_deps}
    adafruit/Adafruit SSD1306@2.5.15
    adafruit/Adafruit GFX Library@1.12.4
    adafruit/Adafruit BusIO@1.17.4
