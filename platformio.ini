[platformio]
default_envs = native

[env]
monitor_speed = 19200
lib_ldf_mode = deep+

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<*>
build_flags =
    -std=gnu++17

[env:c3_transponder]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DIDLAP_PROFIL_TRANSPONDER=1
    -DIDLAP_AKTIF_W5500=0
    -DIDLAP_AKTIF_OLED=0
    -DIDLAP_AKTIF_LED=1
    -DIDLAP_AKTIF_BUZZER=0

[env:c3_decoder_minimal]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DIDLAP_PROFIL_DECODER=1
    -DIDLAP_AKTIF_W5500=0
    -DIDLAP_AKTIF_OLED=0
    -DIDLAP_AKTIF_LED=1
    -DIDLAP_AKTIF_BUZZER=0

[env:c3_decoder_w5500]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DIDLAP_PROFIL_DECODER=1
    -DIDLAP_AKTIF_W5500=1
    -DIDLAP_AKTIF_OLED=0
    -DIDLAP_AKTIF_LED=1
    -DIDLAP_AKTIF_BUZZER=0

[env:c3_decoder_lengkap]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DIDLAP_PROFIL_DECODER=1
    -DIDLAP_AKTIF_W5500=1
    -DIDLAP_AKTIF_OLED=1
    -DIDLAP_AKTIF_LED=1
    -DIDLAP_AKTIF_BUZZER=1
