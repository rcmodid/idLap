name: Release firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build all ESP32-C3 firmware profiles
        run: |
          pio run -e c3_transponder
          pio run -e c3_decoder_minimal
          pio run -e c3_decoder_w5500
          pio run -e c3_decoder_lengkap

      - name: Package release assets
        shell: pwsh
        run: |
          ./scripts/Package-Release.ps1 `
            -BuildDirectory .pio/build `
            -BootApp0Path "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" `
            -OutputDirectory dist `
            -Version "${{ steps.version.outputs.value }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/*.bin
            dist/manifest.json
            dist/SHA256SUMS
